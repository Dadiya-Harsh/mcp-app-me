[project]
name = "mcp-app-me"
version = "0.0.1"
description = "MCP server for my portfolio."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Harsh Dadiya", email = "harshdadiya@gmail.com" }]
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/Dadiya-Harsh/mcp-app-me"
"Bug Tracker" = "https://github.com/Dadiya-Harsh/mcp-app-me/issues"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["main.py", "portfolio_mcp", "tests"]
